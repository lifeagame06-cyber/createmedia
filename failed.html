    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://aafuqhcolkmvswgnzjod.supabase.co";
const SUPABASE_KEY = "sb_publishable_Amw041xz_YYjJ9v_2wk4vg_Hf4M1jFw";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(window.location.search);
const sellerEbookId = params.get("sellerEbook");
const ebookParam = params.get("ebook");
const affiliateRef = params.get("ref");

const legacyPlatformEbooks = [
    { name: "Ebook 1", price: 199 },
    { name: "Ebook 2", price: 249 },
    { name: "Ebook 3", price: 299 },
    { name: "Ebook 4", price: 349 },
    { name: "Ebook 5", price: 399 }
];

let selectedDatabaseEbook = null;
let legacyIndex = null;

function isUuid(value) {
    return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
        .test(value || "");
}

async function loadDatabaseEbook(id) {
    const { data, error } = await supabaseClient
        .from("ebooks")
        .select("id, title, price, ebook_type, status, listing_status")
        .eq("id", id)
        .maybeSingle();

    if (error) {
        console.error("Failed-page ebook load error:", error);
        return null;
    }

    return data || null;
}

function buildRetryUrl() {
    let url;

    if (selectedDatabaseEbook) {
        if (
            sellerEbookId ||
            selectedDatabaseEbook.ebook_type === "seller"
        ) {
            url =
                "payment.html?sellerEbook=" +
                encodeURIComponent(selectedDatabaseEbook.id);
        } else {
            url =
                "payment.html?ebook=" +
                encodeURIComponent(selectedDatabaseEbook.id);
        }
    } else {
        url =
            "payment.html?ebook=" +
            encodeURIComponent(legacyIndex ?? 0);
    }

    if (affiliateRef) {
        url += "&ref=" + encodeURIComponent(affiliateRef);
    }

    return url;
}

async function initializeFailedPage() {
    const {
        data: { session },
        error: authError
    } = await supabaseClient.auth.getSession();

    if (authError) {
        console.error("Failed-page auth error:", authError);
    }

    const user = session?.user || null;

    if (!user) {
        sessionStorage.setItem(
            "createMediaReturnAfterLogin",
            window.location.pathname + window.location.search
        );

        window.location.href = "login.html";
        return;
    }

    const databaseId =
        sellerEbookId ||
        (isUuid(ebookParam) ? ebookParam : null);

    let selectedEbook = null;

    if (databaseId) {
        selectedDatabaseEbook =
            await loadDatabaseEbook(databaseId);

        if (selectedDatabaseEbook) {
            selectedEbook = {
                name: selectedDatabaseEbook.title,
                price: Number(selectedDatabaseEbook.price || 0)
            };
        }
    } else {
        legacyIndex = Number.parseInt(ebookParam, 10);

        if (
            !Number.isInteger(legacyIndex) ||
            legacyIndex < 0 ||
            legacyIndex >= legacyPlatformEbooks.length
        ) {
            legacyIndex = 0;
        }

        selectedEbook = legacyPlatformEbooks[legacyIndex];
    }

    if (!selectedEbook) {
        document.getElementById("failedEbookName").textContent =
            "Ebook unavailable";
        document.getElementById("failedPrice").textContent = "";

        const retryButton =
            document.getElementById("retryButton");

        retryButton.removeAttribute("href");
        retryButton.textContent = "Ebook Unavailable";
        retryButton.style.pointerEvents = "none";
        retryButton.style.opacity = "0.55";
        return;
    }

    document.getElementById("failedEbookName").textContent =
        selectedEbook.name;

    document.getElementById("failedPrice").textContent =
        "₹" + Number(selectedEbook.price).toLocaleString("en-IN");

    document.getElementById("retryButton").href =
        buildRetryUrl();
}

initializeFailedPage();
</script>
