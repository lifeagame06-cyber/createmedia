   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://aafuqhcolkmvswgnzjod.supabase.co";
const SUPABASE_KEY = "sb_publishable_Amw041xz_YYjJ9v_2wk4vg_Hf4M1jFw";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(window.location.search);
const sellerEbookId = params.get("sellerEbook");
const ebookParam = params.get("ebook");
const affiliateRef = params.get("ref");

const firstPaintDatabaseId =
    sellerEbookId ||
    (isUuid(ebookParam) ? ebookParam : null);

if (firstPaintDatabaseId) {
    let firstPaint = null;

    try {
        firstPaint = JSON.parse(
            sessionStorage.getItem("createMediaCheckout_" + firstPaintDatabaseId) || "null"
        );
    } catch (_) {}

    if (!firstPaint) {
        firstPaint = getMarketplaceCheckoutSeed(firstPaintDatabaseId);
    }

    if (firstPaint && firstPaint.name && firstPaint.price != null) {
        document.getElementById("checkoutName").textContent = firstPaint.name;
        document.getElementById("checkoutPrice").textContent =
            "₹" + Number(firstPaint.price).toLocaleString("en-IN");

        const firstPaintImage = document.getElementById("checkoutImage");
        if (firstPaint.image) {
            firstPaintImage.src = firstPaint.image;
            firstPaintImage.alt = firstPaint.name;
            firstPaintImage.style.visibility = "visible";
        }
    }
}

const legacyPlatformEbooks = [
    { name: "Ebook 1", image: "images/ebook.jpg",  price: 199 },
    { name: "Ebook 2", image: "images/image1.jpg", price: 249 },
    { name: "Ebook 3", image: "images/image2.jpg", price: 299 },
    { name: "Ebook 4", image: "images/image3.jpg", price: 349 },
    { name: "Ebook 5", image: "images/image4.jpg", price: 399 }
];

function isUuid(value) {
    return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
        .test(value || "");
}

function finishCheckoutArrival() {}

function setUnavailable() {
    document.getElementById("checkoutImage").src = "";
    document.getElementById("checkoutName").textContent = "Ebook unavailable";
    document.getElementById("checkoutPrice").textContent = "";

    const button = document.getElementById("detailsButton");
    button.textContent = "Ebook Unavailable";
    button.removeAttribute("href");
    button.style.pointerEvents = "none";
    button.style.opacity = "0.55";
    finishCheckoutArrival();
}

async function signedCoverUrl(path) {
    if (!path) return "";

    const { data, error } = await supabaseClient.storage
        .from("ebook-covers")
        .createSignedUrl(path, 60 * 60);

    if (error || !data?.signedUrl) {
        console.error("Cover URL error:", error);
        return "";
    }

    return data.signedUrl;
}

async function loadDatabaseEbook(id) {
    const { data, error } = await supabaseClient
        .from("ebooks")
        .select("id, title, price, cover_path, ebook_type, seller_id, status, listing_status")
        .eq("id", id)
        .eq("status", "approved")
        .eq("listing_status", "listed")
        .maybeSingle();

    if (error) {
        console.error("Checkout ebook error:", error);
        return null;
    }

    return data || null;
}


function getMarketplaceCheckoutSeed(databaseId) {
    if (!databaseId) return null;

    try {
        const ebooks = JSON.parse(
            sessionStorage.getItem("createMediaMarketplaceEbooksV1") || "[]"
        );
        const ebook = ebooks.find(item => item.id === databaseId);
        if (!ebook) return null;

        const assetCache = JSON.parse(
            sessionStorage.getItem("createMediaMarketplaceAssetCacheV2") || "{}"
        );

        return {
            name: ebook.title || "",
            price: Number(ebook.price || 0),
            image: ebook.cover_path
                ? ((assetCache.covers || {})[ebook.cover_path] || "")
                : ""
        };
    } catch (_) {
        return null;
    }
}

async function initializeCheckout() {
    const {
        data: { session },
        error: authError
    } = await supabaseClient.auth.getSession();

    if (authError) {
        console.error("Checkout auth error:", authError);
    }

    const user = session?.user || null;

    if (!user) {
        sessionStorage.setItem(
            "createMediaReturnAfterLogin",
            window.location.pathname + window.location.search
        );

        window.location.href = "login.html";
        return;
    }

    let selected = null;
    let detailsUrl = "";

    const databaseId =
        sellerEbookId ||
        (isUuid(ebookParam) ? ebookParam : null);

    // Paint cached marketplace data immediately, before any additional ebook request.
    if (databaseId) {
        let instant = null;
        try {
            instant = JSON.parse(
                sessionStorage.getItem("createMediaCheckout_" + databaseId) || "null"
            );
        } catch (_) {}

        if (!instant) {
            instant = getMarketplaceCheckoutSeed(databaseId);
        }

        if (instant && instant.name && instant.price != null) {
            document.getElementById("checkoutName").textContent = instant.name;
            document.getElementById("checkoutPrice").textContent =
                "₹" + Number(instant.price).toLocaleString("en-IN");

            const instantImage = document.getElementById("checkoutImage");
            if (instant.image) {
                instantImage.src = instant.image;
                instantImage.alt = instant.name;
                instantImage.style.visibility = "visible";
            }
        }
    }

    if (databaseId) {
        const cacheKey = "createMediaCheckout_" + databaseId;
        let cached = null;

        try {
            cached = JSON.parse(sessionStorage.getItem(cacheKey) || "null");
        } catch (_) {}

        // First visit from Creator Marketplace: reuse data and the already-signed
        // cover URL that the marketplace has already loaded.
        if (!cached || !cached.name || cached.price == null) {
            const marketplaceSeed = getMarketplaceCheckoutSeed(databaseId);

            if (marketplaceSeed && marketplaceSeed.name) {
                const seedDetailsUrl = sellerEbookId
                    ? "details.html?sellerEbook=" + encodeURIComponent(databaseId)
                    : "details.html?ebook=" + encodeURIComponent(databaseId);

                cached = {
                    name: marketplaceSeed.name,
                    price: marketplaceSeed.price,
                    image: marketplaceSeed.image || "",
                    detailsUrl: seedDetailsUrl
                };

                try {
                    sessionStorage.setItem(cacheKey, JSON.stringify(cached));
                } catch (_) {}
            }
        }

        if (cached && cached.name && cached.price != null) {
            selected = {
                name: cached.name,
                price: Number(cached.price),
                image: cached.image || ""
            };
            detailsUrl = cached.detailsUrl || "";
        } else {
            const ebook = await loadDatabaseEbook(databaseId);

            if (!ebook) {
                setUnavailable();
                return;
            }

            const realCover = await signedCoverUrl(ebook.cover_path);

            detailsUrl = (sellerEbookId || ebook.ebook_type === "seller")
                ? "details.html?sellerEbook=" + encodeURIComponent(ebook.id)
                : "details.html?ebook=" + encodeURIComponent(ebook.id);

            selected = {
                name: ebook.title,
                price: Number(ebook.price || 0),
                image: realCover || ""
            };

            try {
                sessionStorage.setItem(cacheKey, JSON.stringify({
                    name: selected.name,
                    price: selected.price,
                    image: selected.image,
                    detailsUrl: detailsUrl
                }));
            } catch (_) {}
        }
    } else {
        let index = Number.parseInt(ebookParam, 10);

        if (
            !Number.isInteger(index) ||
            index < 0 ||
            index >= legacyPlatformEbooks.length
        ) {
            index = 0;
        }

        const ebook = legacyPlatformEbooks[index];

        selected = {
            name: ebook.name,
            price: ebook.price,
            image: ebook.image
        };

        detailsUrl =
            "details.html?ebook=" +
            encodeURIComponent(index);
    }

    const checkoutImage = document.getElementById("checkoutImage");
    if (selected.image) {
        checkoutImage.style.visibility = "hidden";
        checkoutImage.onload = function() {
            checkoutImage.style.visibility = "visible";
        };
        checkoutImage.onerror = function() {
            checkoutImage.style.visibility = "hidden";
        };
        checkoutImage.src = selected.image;
        if (checkoutImage.complete && checkoutImage.naturalWidth > 0) {
            checkoutImage.style.visibility = "visible";
        }
    } else {
        checkoutImage.removeAttribute("src");
        checkoutImage.style.visibility = "hidden";
    }
    checkoutImage.alt = selected.name;
    document.getElementById("checkoutName").textContent = selected.name;
    document.getElementById("checkoutPrice").textContent =
        "₹" + Number(selected.price).toLocaleString("en-IN");

    /*
        Affiliate reference is carried forward to payment.
        Commission is created only after verified payment by the future
        secure order/payment backend, never trusted from browser input.
    */
    if (affiliateRef) {
        detailsUrl +=
            (detailsUrl.includes("?") ? "&" : "?") +
            "ref=" + encodeURIComponent(affiliateRef);
    }

    const detailsButton = document.getElementById("detailsButton");
    detailsButton.href = detailsUrl;

    // Warm the next page in the browser cache without delaying checkout.
    const nextPagePrefetch = document.createElement("link");
    nextPagePrefetch.rel = "prefetch";
    nextPagePrefetch.href = detailsUrl;
    document.head.appendChild(nextPagePrefetch);

}

initializeCheckout();
</script>
