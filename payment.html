<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://aafuqhcolkmvswgnzjod.supabase.co";
const SUPABASE_KEY = "sb_publishable_Amw041xz_YYjJ9v_2wk4vg_Hf4M1jFw";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(window.location.search);
const sellerEbookId = params.get("sellerEbook");
const ebookParam = params.get("ebook");
const affiliateRef = params.get("ref");

const paymentDatabaseId =
    sellerEbookId ||
    (/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(ebookParam || "")
        ? ebookParam
        : null);

// First paint: reuse the verified checkout/details cache immediately.
// The database request below still verifies the current ebook before payment.
if (paymentDatabaseId) {
    try {
        const cachedPaymentEbook = JSON.parse(
            sessionStorage.getItem("createMediaCheckout_" + paymentDatabaseId) || "null"
        );

        if (cachedPaymentEbook &&
            cachedPaymentEbook.name &&
            cachedPaymentEbook.price != null) {

            const instantPrice =
                "₹" + Number(cachedPaymentEbook.price).toLocaleString("en-IN");

            document.getElementById("paymentEbookName").textContent =
                cachedPaymentEbook.name;

            document.getElementById("paymentPrice").textContent =
                instantPrice;

            document.getElementById("payButton").textContent =
                "Pay " + instantPrice;
        }
    } catch (_) {}
}

const legacyPlatformEbooks = [
    { name: "Ebook 1", price: 199 },
    { name: "Ebook 2", price: 249 },
    { name: "Ebook 3", price: 299 },
    { name: "Ebook 4", price: 349 },
    { name: "Ebook 5", price: 399 }
];

let currentUser = null;
let selectedDatabaseEbook = null;
let selectedEbook = null;
let legacyIndex = null;

function isUuid(value) {
    return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
        .test(value || "");
}

async function loadDatabaseEbook(id) {
    const { data, error } = await supabaseClient
        .from("ebooks")
        .select("id, title, price, ebook_type, seller_id, status, listing_status")
        .eq("id", id)
        .eq("status", "approved")
        .eq("listing_status", "listed")
        .maybeSingle();

    if (error) {
        console.error("Payment ebook load error:", error);
        return null;
    }

    return data || null;
}

function buildRoute(pageName) {
    let url;

    if (selectedDatabaseEbook) {
        if (
            sellerEbookId ||
            selectedDatabaseEbook.ebook_type === "seller"
        ) {
            url =
                pageName + "?sellerEbook=" +
                encodeURIComponent(selectedDatabaseEbook.id);
        } else {
            url =
                pageName + "?ebook=" +
                encodeURIComponent(selectedDatabaseEbook.id);
        }
    } else {
        url =
            pageName + "?ebook=" +
            encodeURIComponent(legacyIndex ?? 0);
    }

    if (affiliateRef) {
        url += "&ref=" + encodeURIComponent(affiliateRef);
    }

    return url;
}

function disablePayment(message) {
    const payButton = document.getElementById("payButton");
    payButton.disabled = true;
    payButton.textContent = message || "Payment Unavailable";
    payButton.style.opacity = "0.55";
    payButton.style.cursor = "not-allowed";
}

async function initializePaymentPage() {
    const {
        data: { session },
        error: authError
    } = await supabaseClient.auth.getSession();

    if (authError) {
        console.error("Payment auth error:", authError);
    }

    const user = session?.user || null;

    if (!user) {
        sessionStorage.setItem(
            "createMediaReturnAfterLogin",
            window.location.pathname + window.location.search
        );

        window.location.href = "login.html";
        return;
    }

    currentUser = user;

    const databaseId =
        sellerEbookId ||
        (isUuid(ebookParam) ? ebookParam : null);

    if (databaseId) {
        selectedDatabaseEbook =
            await loadDatabaseEbook(databaseId);

        if (!selectedDatabaseEbook) {
            document.getElementById("paymentEbookName").textContent =
                "Ebook unavailable";
            document.getElementById("paymentPrice").textContent = "";
            disablePayment("Ebook Unavailable");
            return;
        }

        selectedEbook = {
            name: selectedDatabaseEbook.title,
            price: Number(selectedDatabaseEbook.price || 0)
        };
    } else {
        legacyIndex = Number.parseInt(ebookParam, 10);

        if (
            !Number.isInteger(legacyIndex) ||
            legacyIndex < 0 ||
            legacyIndex >= legacyPlatformEbooks.length
        ) {
            legacyIndex = 0;
        }

        selectedEbook = legacyPlatformEbooks[legacyIndex];
    }

    const formattedPrice =
        "₹" + Number(selectedEbook.price).toLocaleString("en-IN");

    document.getElementById("paymentEbookName").textContent =
        selectedEbook.name;

    document.getElementById("paymentPrice").textContent =
        formattedPrice;

    document.getElementById("payButton").textContent =
        "Pay " + formattedPrice;

    document.getElementById("backDetails").href =
        buildRoute("details.html");

    document.getElementById("failedButton").href =
        buildRoute("failed.html");
}

document.getElementById("payButton").onclick = async function() {
    if (!currentUser || !selectedEbook) return;

    /*
        IMPORTANT:
        A paid order must never be inserted directly by browser JavaScript.
        The orders table intentionally has no client INSERT policy.

        When Razorpay/another gateway is connected, this button should call
        a Supabase Edge Function that:
        1. creates the gateway order,
        2. verifies the payment server-side,
        3. inserts the completed order using trusted server credentials,
        4. calculates seller/platform/affiliate earnings server-side,
        5. returns the verified order id.

        Until that backend exists, this page keeps the existing demo-success
        navigation without creating fake Supabase sales/orders.
    */

    const button = document.getElementById("payButton");
    button.disabled = true;
    button.textContent = "Processing...";

    const { data: orderId, error: orderError } =
    await supabaseClient.rpc("create_demo_order", {
        p_ebook_id: selectedDatabaseEbook?.id
    });

if (orderError) {
    console.error("Demo order error:", orderError);
    alert("Order create nahi hua: " + orderError.message);

    button.disabled = false;
    button.textContent =
        "Pay ₹" + Number(selectedEbook.price).toLocaleString("en-IN");

    return;
}

window.location.href =
    "success.html?order=" + encodeURIComponent(orderId);
};

initializePaymentPage();
</script>
