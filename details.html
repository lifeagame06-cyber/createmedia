    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://aafuqhcolkmvswgnzjod.supabase.co";
const SUPABASE_KEY = "sb_publishable_Amw041xz_YYjJ9v_2wk4vg_Hf4M1jFw";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(window.location.search);
const sellerEbookId = params.get("sellerEbook");
const ebookParam = params.get("ebook");
const affiliateRef = params.get("ref");

// Seller product summary: restore the last verified checkout/details value
// synchronously so refresh never flashes ₹199 or blanks the title/price.
if (sellerEbookId) {
    try {
        const cachedSeller = JSON.parse(
            sessionStorage.getItem("createMediaCheckout_" + sellerEbookId) || "null"
        );
        if (cachedSeller && cachedSeller.name && cachedSeller.price != null) {
            document.getElementById("productName").textContent = cachedSeller.name;
            document.getElementById("productPrice").textContent =
                "₹" + Number(cachedSeller.price).toLocaleString("en-IN");
        }
    } catch (_) {}
}

const legacyPlatformEbooks = [
    { name: "Ebook 1", price: 199 },
    { name: "Ebook 2", price: 249 },
    { name: "Ebook 3", price: 299 },
    { name: "Ebook 4", price: 349 },
    { name: "Ebook 5", price: 399 }
];

let currentUser = null;
let selectedEbook = null;
let selectedDatabaseEbook = null;
let legacyIndex = null;

function isUuid(value) {
    return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
        .test(value || "");
}

function showAlert(message) {
    document.getElementById("alertMessage").textContent = message;
    document.getElementById("customAlert").style.display = "flex";
}

function closeAlert() {
    document.getElementById("customAlert").style.display = "none";
}

async function loadDatabaseEbook(id) {
    const { data, error } = await supabaseClient
        .from("ebooks")
        .select("id, title, price, ebook_type, seller_id, status, listing_status")
        .eq("id", id)
        .eq("status", "approved")
        .eq("listing_status", "listed")
        .maybeSingle();

    if (error) {
        console.error("Ebook load error:", error);
        return null;
    }

    return data || null;
}

async function loadCustomerProfile() {
    const {
        data: { session },
        error: authError
    } = await supabaseClient.auth.getSession();

    if (authError) {
        console.error("Auth error:", authError);
    }

    const user = session?.user || null;

    if (!user) {
        sessionStorage.setItem(
            "createMediaReturnAfterLogin",
            window.location.pathname + window.location.search
        );

        window.location.href = "login.html";
        return false;
    }

    currentUser = user;

    // Fill what Auth already knows immediately.
    document.getElementById("name").value =
        user.user_metadata?.name ||
        user.user_metadata?.full_name ||
        "";

    document.getElementById("email").value =
        user.email || "";

    // Profile data can hydrate without blocking product loading.
    const profilePromise = supabaseClient
        .from("profiles")
        .select("name, email, whatsapp")
        .eq("id", user.id)
        .maybeSingle();

    return { user, profilePromise };
}

async function loadSelectedEbook() {
    const databaseId =
        sellerEbookId ||
        (isUuid(ebookParam) ? ebookParam : null);

    if (databaseId) {
        selectedDatabaseEbook =
            await loadDatabaseEbook(databaseId);

        if (!selectedDatabaseEbook) {
            selectedEbook = null;
            document.getElementById("productName").textContent =
                "Ebook unavailable";
            document.getElementById("productPrice").textContent = "";
            return;
        }

        selectedEbook = {
            name: selectedDatabaseEbook.title,
            price: Number(selectedDatabaseEbook.price || 0)
        };
    } else {
        legacyIndex = Number.parseInt(ebookParam, 10);

        if (
            !Number.isInteger(legacyIndex) ||
            legacyIndex < 0 ||
            legacyIndex >= legacyPlatformEbooks.length
        ) {
            legacyIndex = 0;
        }

        selectedEbook = legacyPlatformEbooks[legacyIndex];
    }

    const verifiedName = selectedEbook.name;
    const verifiedPrice =
        "₹" + Number(selectedEbook.price).toLocaleString("en-IN");

    const productNameEl = document.getElementById("productName");
    const productPriceEl = document.getElementById("productPrice");

    if (productNameEl.textContent !== verifiedName) {
        productNameEl.textContent = verifiedName;
    }
    if (productPriceEl.textContent !== verifiedPrice) {
        productPriceEl.textContent = verifiedPrice;
    }

    if (databaseId) {
        try {
            const previous = JSON.parse(
                sessionStorage.getItem("createMediaCheckout_" + databaseId) || "null"
            ) || {};
            sessionStorage.setItem(
                "createMediaCheckout_" + databaseId,
                JSON.stringify({
                    ...previous,
                    name: selectedEbook.name,
                    price: Number(selectedEbook.price)
                })
            );
        } catch (_) {}
    }
}

function buildRoute(pageName) {
    let url;

    if (selectedDatabaseEbook) {
        if (
            sellerEbookId ||
            selectedDatabaseEbook.ebook_type === "seller"
        ) {
            url =
                pageName + "?sellerEbook=" +
                encodeURIComponent(selectedDatabaseEbook.id);
        } else {
            url =
                pageName + "?ebook=" +
                encodeURIComponent(selectedDatabaseEbook.id);
        }
    } else {
        url =
            pageName + "?ebook=" +
            encodeURIComponent(legacyIndex ?? 0);
    }

    if (affiliateRef) {
        url += "&ref=" + encodeURIComponent(affiliateRef);
    }

    return url;
}

document.getElementById("paymentButton").onclick =
async function() {
    if (!currentUser) {
        showAlert("Please login again to continue.");
        return;
    }

    if (!selectedEbook) {
        showAlert("This ebook is no longer available.");
        return;
    }

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const whatsapp =
        document.getElementById("whatsapp").value.trim();

    const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    const whatsappPattern =
        /^[6-9]\d{9}$/;

    if (!name || !email || !whatsapp) {
        showAlert("Please fill all details.");
        return;
    }

    if (!emailPattern.test(email)) {
        showAlert("Please enter a valid email address.");
        return;
    }

    if (!whatsappPattern.test(whatsapp)) {
        showAlert("Please enter a valid 10-digit WhatsApp number.");
        return;
    }

    /*
        Authenticated account email is the order identity.
        Do not allow a typed email to silently change the buyer identity.
    */
    const authEmail =
        String(currentUser.email || "").trim().toLowerCase();

    if (authEmail && email.toLowerCase() !== authEmail) {
        showAlert(
            "Please use the email address linked to your createMedia account."
        );
        return;
    }

    const button =
        document.getElementById("paymentButton");

    button.disabled = true;
    button.textContent = "Saving...";

    const { error: profileError } = await supabaseClient
        .from("profiles")
        .update({
            name: name,
            whatsapp: whatsapp,
            updated_at: new Date().toISOString()
        })
        .eq("id", currentUser.id);

    if (profileError) {
        console.error("Profile update error:", profileError);
        showAlert("Could not save your details. Please try again.");
        button.disabled = false;
        button.textContent = "Continue to Payment";
        return;
    }

    /*
        Temporary cross-page form state only.
        Payment/order creation itself is NOT done from the browser.
        The secure payment backend will create the order after verification.
    */
    sessionStorage.setItem("customerName", name);
    sessionStorage.setItem("customerEmail", email);
    sessionStorage.setItem("customerWhatsapp", whatsapp);

    window.location.href = buildRoute("payment.html");
};

async function initializeDetailsPage() {
    const authState = await loadCustomerProfile();
    if (!authState) return;

    const productPromise = loadSelectedEbook();

    const [profileResult] = await Promise.all([
        authState.profilePromise,
        productPromise
    ]);

    if (profileResult.error) {
        console.error("Profile load error:", profileResult.error);
    } else {
        const profile = profileResult.data;

        document.getElementById("name").value =
            profile?.name ||
            document.getElementById("name").value;

        document.getElementById("email").value =
            profile?.email ||
            document.getElementById("email").value;

        document.getElementById("whatsapp").value =
            profile?.whatsapp || "";
    }

    document.getElementById("backButton").href =
        buildRoute("checkout.html");
}

initializeDetailsPage();
</script>
