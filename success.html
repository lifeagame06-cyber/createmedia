<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://aafuqhcolkmvswgnzjod.supabase.co";
const SUPABASE_KEY = "sb_publishable_Amw041xz_YYjJ9v_2wk4vg_Hf4M1jFw";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(window.location.search);
const orderId = params.get("order");
const sellerEbookId = params.get("sellerEbook");
const ebookParam = params.get("ebook");

const legacyPlatformEbooks = [
    { name: "Ebook 1", price: 199 },
    { name: "Ebook 2", price: 249 },
    { name: "Ebook 3", price: 299 },
    { name: "Ebook 4", price: 349 },
    { name: "Ebook 5", price: 399 }
];

function isUuid(value) {
    return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value || "");
}

function showPreparing(show) {
    document.getElementById("ebookPreparing").style.display = show ? "flex" : "none";
}

function showViewButton(href) {
    const button = document.getElementById("viewEbookButton");
    button.href = href;
    button.style.display = "block";
}

function showNotVerified() {
    document.querySelector(".label").textContent = "PAYMENT NOT VERIFIED";
    document.querySelector("h1").textContent = "Order Not Confirmed";
    document.querySelector(".message").textContent =
        "This page cannot confirm a purchase until the payment is verified by createMedia.";
    showPreparing(false);
    document.getElementById("viewEbookButton").style.display = "none";
}

async function loadVerifiedOrder(user) {
    if (!orderId || !isUuid(orderId)) return null;

    const { data, error } = await supabaseClient
        .from("orders")
        .select("id, buyer_id, ebook_id, ebook_title, amount, payment_status, order_status")
        .eq("id", orderId)
        .eq("buyer_id", user.id)
        .eq("payment_status", "paid")
        .eq("order_status", "completed")
        .maybeSingle();

    if (error) {
        console.error("Verified order load error:", error);
        return null;
    }

    return data || null;
}

async function loadDisplayEbook() {
    const databaseId = sellerEbookId || (isUuid(ebookParam) ? ebookParam : null);

    if (databaseId) {
        const { data, error } = await supabaseClient
            .from("ebooks")
            .select("id, title, price")
            .eq("id", databaseId)
            .maybeSingle();

        if (!error && data) {
            return { name: data.title, price: Number(data.price || 0) };
        }
    }

    const index = Number.parseInt(ebookParam, 10);
    if (Number.isInteger(index) && index >= 0 && index < legacyPlatformEbooks.length) {
        return legacyPlatformEbooks[index];
    }

    return null;
}

async function initializeSuccessPage() {
    const { data: { session }, error: authError } = await supabaseClient.auth.getSession();

    if (authError) console.error("Success auth error:", authError);

    const user = session?.user || null;

    if (!user) {
        sessionStorage.setItem(
            "createMediaReturnAfterLogin",
            window.location.pathname + window.location.search
        );
        window.location.href = "login.html";
        return;
    }

    const verifiedOrder = await loadVerifiedOrder(user);

    if (verifiedOrder) {
        document.getElementById("successEbookName").textContent =
            verifiedOrder.ebook_title || "Your Ebook";
        document.getElementById("successPrice").textContent =
            "₹" + Number(verifiedOrder.amount || 0).toLocaleString("en-IN");

        // Prepare the purchased ebook before the user clicks View My Ebook.
        // Access is still verified again inside ebook.html using the order id.
        if (verifiedOrder.ebook_id) {
            const checkoutKey = "createMediaCheckout_" + verifiedOrder.ebook_id;
            let prepared = null;

            try {
                prepared = JSON.parse(sessionStorage.getItem(checkoutKey) || "null");
            } catch (_) {}

            let title = verifiedOrder.ebook_title || prepared?.name || "Your Ebook";
            let description = "";
            let coverUrl = prepared?.image || "";

            const { data: ebookData, error: ebookError } = await supabaseClient
                .from("ebooks")
                .select("id, title, description, cover_path")
                .eq("id", verifiedOrder.ebook_id)
                .maybeSingle();

            if (!ebookError && ebookData) {
                title = ebookData.title || title;
                description = ebookData.description || "";

                if (!coverUrl && ebookData.cover_path) {
                    const { data: coverData, error: coverError } =
                        await supabaseClient.storage
                            .from("ebook-covers")
                            .createSignedUrl(ebookData.cover_path, 60 * 60);

                    if (!coverError && coverData?.signedUrl) {
                        coverUrl = coverData.signedUrl;
                    }
                }
            }

            try {
                sessionStorage.setItem(
                    "createMediaPurchasedEbook_" + verifiedOrder.id,
                    JSON.stringify({
                        title: title,
                        description: description,
                        coverUrl: coverUrl
                    })
                );
            } catch (_) {}

            document.getElementById("successEbookName").textContent = title;
        }

        showPreparing(false);
        showViewButton(
            "ebook.html?order=" + encodeURIComponent(verifiedOrder.id) +
            (verifiedOrder.ebook_id
                ? "&ebook=" + encodeURIComponent(verifiedOrder.ebook_id)
                : "")
        );
        return;
    }

    /*
       Current payment.html still has a demo navigation while the real gateway
       and Edge Function are not connected. Display the selected product for UI
       testing, but NEVER create an order, sale, seller earning, affiliate reward,
       referral reward, notification, or ebook access from this browser page.
    */
    const displayEbook = await loadDisplayEbook();

    if (displayEbook) {
        document.getElementById("successEbookName").textContent = displayEbook.name;
        document.getElementById("successPrice").textContent =
            "₹" + Number(displayEbook.price || 0).toLocaleString("en-IN");
    }

    showNotVerified();
}

initializeSuccessPage();
</script>
